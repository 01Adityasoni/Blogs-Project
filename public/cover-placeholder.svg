<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cover image placeholder</title>
  <desc id="desc">A neutral placeholder shown when a blog cover image is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#dbe4ee" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="40" fill="url(#bg)" />
  <rect x="80" y="80" width="1040" height="515" rx="28" fill="#ffffff" opacity="0.7" />
  <circle cx="420" cy="270" r="78" fill="#94a3b8" opacity="0.55" />
  <path d="M300 510l170-175 116 120 78-85 198 140H300z" fill="#94a3b8" opacity="0.45" />
  <rect x="140" y="140" width="280" height="30" rx="15" fill="#64748b" opacity="0.35" />
  <rect x="140" y="190" width="420" height="20" rx="10" fill="#64748b" opacity="0.22" />
  <rect x="140" y="225" width="360" height="20" rx="10" fill="#64748b" opacity="0.22" />
  <rect x="140" y="260" width="300" height="20" rx="10" fill="#64748b" opacity="0.22" />
  <text x="140" y="405" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Cover image unavailable</text>
  <text x="140" y="455" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="24">The original file is missing or not accessible.</text>
</svg>